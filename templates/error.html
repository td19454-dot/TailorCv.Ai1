<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Something went wrong ({{ status_code or 500 }}) | TailorCV</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #040812 0%, #07102b 100%);
            color: #eef2ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .err-top {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 20px;
        }
        .err-top a { display: inline-flex; align-items: center; }
        .err-top img { height: 300px; width: auto; }
        .err-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px 24px 80px;
            max-width: 820px;
            margin: 0 auto;
            width: 100%;
        }
        .err-code {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #6f86b8;
            margin-bottom: 18px;
        }
        .err-title {
            font-size: clamp(1.9rem, 5vw, 3.4rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 18px;
        }
        .err-title .hl {
            background: linear-gradient(135deg, #5b8cff, #b07cf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .err-sub {
            font-size: clamp(1rem, 2.2vw, 1.25rem);
            font-weight: 300;
            line-height: 1.6;
            color: #aab9da;
            max-width: 560px;
            margin: 0 auto 30px;
        }
        .err-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
        }
        .err-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 26px;
            border-radius: 12px;
            font-size: 0.98rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
        }
        .err-btn-primary {
            color: #fff;
            border: none;
            background: linear-gradient(135deg, #4f7fff, #8d5cf7);
            box-shadow: 0 8px 24px rgba(79, 127, 255, 0.35);
        }
        .err-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(79, 127, 255, 0.5); }
        .err-btn-ghost {
            color: #cdd9f5;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(125, 170, 255, 0.3);
        }
        .err-btn-ghost:hover { color: #fff; border-color: rgba(125, 170, 255, 0.55); background: rgba(79, 127, 255, 0.12); }
    </style>
</head>
<body>
    <header class="err-top">
        <a href="/" aria-label="TailorCV home">
            <img src="/static/logo6.webp" alt="TailorCV">
        </a>
    </header>

    <main class="err-main">
        <p class="err-code">Error {{ status_code or 500 }}</p>
        <h1 class="err-title">Something went wrong <span class="hl">on our end</span></h1>
        <p class="err-sub">{{ message or "An unexpected error occurred. Please try again in a moment — your work and account are safe." }}</p>
        <div class="err-actions">
            <button type="button" class="err-btn err-btn-primary" onclick="location.reload()">Try Again</button>
            <a href="/" class="err-btn err-btn-ghost">Go to Home</a>
        </div>
    </main>
</body>
</html>
