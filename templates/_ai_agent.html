<!-- Site-wide AI assistant "Tailor". Included once via _footer.html so it appears
     on every product page. Behavior in /static/ai_agent.js, styles in ai_agent.css. -->
<link rel="stylesheet" href="/static/ai_agent.css?v=2">
<div id="tcv-agent" class="tcv-agent" data-open="false" data-seen="false"
     data-logged-in="{{ 'true' if is_logged_in|default(false) else 'false' }}">

  <button class="tcv-agent-orb" type="button" aria-label="Open the Tailor assistant">
    <span class="tcv-agent-badge"></span>
    <svg class="tcv-agent-orb-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"></path>
      <path d="M9 10h6M9 13h4"></path>
    </svg>
    <svg class="tcv-agent-orb-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 6 6 18M6 6l12 12"></path>
    </svg>
  </button>

  <div class="tcv-agent-panel" role="dialog" aria-label="Tailor AI assistant">
    <div class="tcv-agent-head">
      <div class="tcv-agent-av">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l1.9 4.9L19 9.8l-4.9 1.9L12 17l-1.9-5.3L5 9.8l5.1-1.9L12 3z"></path>
        </svg>
      </div>
      <div class="tcv-agent-id">
        <b>Tailor</b>
        <small>AI assistant</small>
      </div>
      <button class="tcv-agent-hbtn tcv-agent-voice-btn" type="button" aria-label="Mute voice" title="Voice on/off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4V5z"></path>
          <path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"></path>
        </svg>
      </button>
      <button class="tcv-agent-hbtn tcv-agent-close-btn" type="button" aria-label="Close assistant" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="tcv-agent-msgs"></div>

    <div class="tcv-agent-foot">
      <textarea class="tcv-agent-input" rows="1" placeholder="Ask me anything…" aria-label="Message Tailor"></textarea>
      <button class="tcv-agent-send" type="button" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13"></path>
          <path d="M22 2 15 22l-4-9-9-4 20-7z"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
<script src="/static/ai_agent.js?v=2" defer></script>
