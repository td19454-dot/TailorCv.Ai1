# Render Blueprint for TailorCV.ai
# This file allows one-click deployment on Render

services:
  - type: web
    name: tailorcv
    env: python
    # playwright install is required now that auto_apply/browser.py launches
    # its own local Chromium (no more Browserbase-hosted session).
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # Render only routes traffic to a new deploy once this returns 2xx, so a
    # build that can't start or can't reach the DB never goes live — the old
    # version keeps serving. /health returns 503 only when the DB is
    # unreachable, and stops querying it after the first success so the
    # periodic checks don't keep Neon awake (see health_check in main.py).
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # Set this from your Render PostgreSQL database
      - key: OPENAI_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render generates a strong random value; required in production
      - key: SENTRY_DSN
        sync: false  # Paste your Sentry project DSN here to enable error tracking
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
