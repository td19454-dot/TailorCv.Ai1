    </g>
    <g transform="translate(70,168) rotate(-12)">
      <ellipse cx="0" cy="0" rx="4.6" ry="3.7"/><ellipse cx="0" cy="-9" rx="4.6" ry="3.7"/><ellipse cx="0" cy="-18" rx="4.2" ry="3.3"/><ellipse cx="0" cy="-26" rx="3.6" ry="3"/>
    </g>
  </g>
  <!-- little flowers -->
  <g>
    <g transform="translate(124,48)">
      <g fill="#c8a6c6"><circle cx="0" cy="-9" r="6"/><circle cx="8.6" cy="-2.8" r="6"/><circle cx="5.3" cy="7.3" r="6"/><circle cx="-5.3" cy="7.3" r="6"/><circle cx="-8.6" cy="-2.8" r="6"/></g>
      <circle r="4" fill="#caa84a"/>
    </g>
    <g transform="translate(40,40) scale(.82)">
      <g fill="#e7d39a"><circle cx="0" cy="-9" r="6"/><circle cx="8.6" cy="-2.8" r="6"/><circle cx="5.3" cy="7.3" r="6"/><circle cx="-5.3" cy="7.3" r="6"/><circle cx="-8.6" cy="-2.8" r="6"/></g>
