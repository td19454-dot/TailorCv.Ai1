<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- vines -->
  <g fill="none" stroke="#7d6a3a" stroke-width="2.4" stroke-linecap="round">
    <path d="M6 6 C 60 34, 100 60, 132 150"/>
    <path d="M6 6 C 36 60, 56 104, 70 168"/>
    <path d="M30 18 C 70 12, 104 22, 124 48"/>
  </g>
  <!-- leaves -->
  <g fill="#6f7d4e">
    <ellipse cx="66" cy="40" rx="16" ry="6.5" transform="rotate(22 66 40)"/>
    <ellipse cx="44" cy="78" rx="15" ry="6" transform="rotate(72 44 78)"/>
    <ellipse cx="100" cy="78" rx="16" ry="6.5" transform="rotate(38 100 78)"/>
    <ellipse cx="58" cy="120" rx="14" ry="5.5" transform="rotate(76 58 120)"/>
    <ellipse cx="118" cy="120" rx="15" ry="6" transform="rotate(48 118 120)"/>
  </g>
  <!-- lavender spikes -->
  <g fill="#8a76a8">
    <g transform="translate(132,150) rotate(-30)">
