<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="popup">
  <div class="header">
    <span class="logo">TailorCV</span>
    <span class="badge">Auto Apply</span>
  </div>

  <div id="status" class="status loading">Checking login…</div>
  <div id="user-info" class="user-info" style="display:none;"></div>

  <form id="login-form" class="login-form" style="display:none;">
    <input type="email" id="login-email" class="login-input" placeholder="Email" required autocomplete="username">
    <input type="password" id="login-password" class="login-input" placeholder="Password" required autocomplete="current-password">
    <button type="submit" id="login-submit" class="login-btn">Log in</button>
    <div id="login-error" class="login-error"></div>
  </form>

  <div id="base-resume-status" class="base-status" style="display:none;"></div>

  <div class="divider"></div>

  <div class="sites">
    <div class="site-row">
      <span>Naukri.com</span>
      <span class="tag green">Active</span>
    </div>
    <div class="site-row">
      <span>Internshala.com</span>
      <span class="tag green">Active</span>
    </div>
    <div class="site-row">
      <span>LinkedIn.com</span>
      <span class="tag green">Active</span>
    </div>
  </div>

  <div class="divider"></div>

  <p class="hint">
    On <strong>Naukri</strong> or <strong>Internshala</strong>, click <strong>Start Auto Apply</strong>
    in the sidebar. On a <strong>LinkedIn</strong> job page, click <strong>Tailor &amp; Download Resume</strong>.
  </p>
</div>
<script src="popup.js"></script>
</body>
</html>
